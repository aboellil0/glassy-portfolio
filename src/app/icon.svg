<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Silver/White Gradient matching Header Badge -->
    <linearGradient id="ma-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#edeef4" />
      <stop offset="100%" stop-color="#c5cbda" />
    </linearGradient>
  </defs>

  <!-- Dark Outer Circle Background -->
  <circle cx="256" cy="256" r="256" fill="#090a0e" />

  <!-- Inner Silver MA Pill Badge -->
  <circle cx="256" cy="256" r="216" fill="url(#ma-grad)" stroke="#ffffff" stroke-width="12" />

  <!-- Monogram MA Text -->
  <text
    x="256"
    y="272"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="210"
    letter-spacing="-8"
    fill="#0e1015"
  >MA</text>
</svg>
